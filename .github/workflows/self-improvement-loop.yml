name: Self-Improvement Loop

# Run on the first day of each month at midnight UTC
on:
  schedule:
    - cron: '0 0 1 * *'
  # Allow manual triggering from GitHub Actions UI
  workflow_dispatch:
    inputs:
      report_only:
        description: 'Generate report only (no documentation updates)'
        required: false
        type: boolean
        default: false

jobs:
  run-loop:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run self-improvement loop
        id: run-loop
        run: |
          node scripts/runSelfImprovementLoop.js --output self-improvement-report.md
          echo "report_path=self-improvement-report.md" >> $GITHUB_OUTPUT

      - name: Read report
        id: read-report
        run: |
          REPORT=$(cat self-improvement-report.md)
          echo "report<<EOF" >> $GITHUB_OUTPUT
          echo "$REPORT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Issue with findings
        uses: actions/github-script@v7
        with:
          script: |
            const report = `${{ steps.read-report.outputs.report }}`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🔄 Self-Improvement Loop Report - ${new Date().toISOString().split('T')[0]}`,
              body: report,
              labels: ['self-improvement', 'automation', 'best-practices']
            });

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: self-improvement-report
          path: self-improvement-report.md
          retention-days: 90

      - name: Send notification (optional)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '⚠️ Self-Improvement Loop Failed',
              body: `The self-improvement loop failed to complete. Check the [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for details.`,
              labels: ['bug', 'self-improvement', 'automation']
            });
